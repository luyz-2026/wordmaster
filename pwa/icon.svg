<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7bff"/>
      <stop offset="0.55" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#7c5cf0"/>
    </linearGradient>
  </defs>
  <!-- 底板：圆角方形，用于常规图标；maskable 版本会另行生成满幅方形 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#g)"/>
  <!-- 单词卡意象：两页纸 + 「WM」字样 -->
  <g fill="#ffffff">
    <rect x="120" y="118" width="196" height="248" rx="26" opacity="0.16"/>
    <rect x="152" y="146" width="196" height="248" rx="26" opacity="0.26"/>
    <rect x="184" y="174" width="196" height="248" rx="26" opacity="0.92"/>
  </g>
  <g stroke="#3b6cf6" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="222" y1="248" x2="342" y2="248"/>
    <line x1="222" y1="296" x2="312" y2="296"/>
  </g>
  <text x="282" y="392" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="700" fill="#3b6cf6" text-anchor="middle">WM</text>
</svg>
