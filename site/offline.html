<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b6cf6">
<title>离线 · WordMaster 背单词</title>
<link rel="icon" href="icons/favicon.ico">
<style>
  :root{--brand:#3b6cf6;--txt:#1c2434;--muted:#6b7689}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;color:var(--txt);
    font:15px/1.7 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;padding:24px}
  .box{max-width:420px;width:100%;background:#fff;border:1px solid #e4e8f0;border-radius:16px;
    padding:34px 30px;text-align:center;box-shadow:0 8px 24px rgba(20,32,64,.06)}
  .logo{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;
    background:linear-gradient(135deg,#4a7bff,#7c5cf0);color:#fff;font-weight:700;font-size:22px;
    display:grid;place-items:center}
  h1{margin:0 0 6px;font-size:19px}
  p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
  .hint{margin:18px 0 0;font-size:12px;color:var(--muted)}
  .hint b{color:var(--txt)}
  button{border:none;background:var(--brand);color:#fff;border-radius:10px;padding:11px 26px;
    font-size:14.5px;cursor:pointer;font-family:inherit}
  button:hover{background:#3560e2}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c3382f;margin-right:6px;
    animation:blink 1.6s infinite}
  .dot.on{background:#16a34a}
  @keyframes blink{50%{opacity:.35}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">WM</div>
  <h1>当前处于离线状态</h1>
  <p><span class="dot" id="dot"></span><span id="state">无法连接网络，但别担心：</span></p>
  <p>已访问过的 WordMaster 页面与数据仍在。<b>词库、学习进度与生词本都保存在本机浏览器中</b>，
     恢复联网后自动同步可用，不需要重新导入。</p>
  <button onclick="location.reload()">重新加载</button>
  <p class="hint">网络恢复后本页会自动跳转 · <span id="online">离线中</span></p>
</div>
<script>
  function paint() {
    var on = navigator.onLine;
    document.getElementById('dot').className = 'dot' + (on ? ' on' : '');
    document.getElementById('online').textContent = on ? '已联网，正在重试…' : '离线中';
    if (on) setTimeout(function () { location.reload(); }, 600);
  }
  window.addEventListener('online', paint);
  window.addEventListener('offline', paint);
  paint();
</script>
</body>
</html>
