        html += '<div class="book">' +
          '<div class="row" style="justify-content:space-between">' +
          '<h4>' + esc(b.name) + '</h4><span class="tag c">' + esc(b.category || '未分类') + '</span></div>' +
          '<div class="meta">' + total + ' 词条 · 导入顺序保留 · 更新于 ' + U.fmtAgo(b.updatedAt) + '</div>' +
          (b.note ? '<div class="meta">' + esc(b.note) + '</div>' : '') +
          '<div class="bar ' + (pct >= 80 ? 'ok' : '') + '"><i style="width:' + pct + '%"></i></div>' +
          '<div class="meta">已学 ' + learned + '/' + total + '（' + pct + '%）· 已掌握 ' + mastered + ' · 生词 ' + nb + '</div>' +
          '<div class="row">' +
          '<button class="btn sm primary" data-open="' + b.id + '">浏览词条</button>' +
          '<button class="btn sm" data-rename="' + b.id + '">重命名/改分类</button>' +
          '<button class="btn sm" data-export="' + b.id + '">导出 CSV</button>' +
          '<button class="btn sm danger" data-del="' + b.id + '">删除</button>' +
          '</div></div>';
      });
      html += '</div>';
      el.innerHTML = html;

      WM.App.setActions('<button class="btn primary" id="new-book">＋ 新建词库</button>' +
        '<button class="btn" id="imp">⇩ 导入词库</button>');
      U.$('#new-book').onclick = newBookDialog;
      U.$('#imp').onclick = function () { WM.App.go('import'); };

      U.$$('[data-open]', el).forEach(function (btn) {
        btn.onclick = function () { WM.App.go('words', { id: btn.getAttribute('data-open') }); };
      });
      U.$$('[data-rename]', el).forEach(function (btn) {
        btn.onclick = function () { renameBookDialog(btn.getAttribute('data-rename')); };
      });
      U.$$('[data-export]', el).forEach(function (btn) {
        btn.onclick = function () { exportBook(btn.getAttribute('data-export')); };
      });
      U.$$('[data-del]', el).forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute('data-del'), b = S.getBook(id);
          WM.modal({
            title: '删除词库', size: '',
            body: '<p>确定删除《' + esc(b.name) + '》吗？该词库独有的词条与其学习记录会一并删除；' +
              '与其他词库共有的词条会保留。</p>',
            actions: [
              { label: '取消', cls: 'ghost' },
              {
                label: '删除', cls: 'danger', onClick: function (close) {
                  S.removeBook(id); close(); WM.toast('已删除词库', 'ok'); WM.App.refresh();
                }
              }]
          });
        };
      });
    }
  };

  function newBookDialog() {
    WM.modal({
      title: '新建空词库',
      body: '<div class="fld"><label class="fld">词库名称</label><input type="text" id="bk-name" placeholder="如：CET-4 核心词"></div>' +
        '<div class="fld" style="margin-top:10px"><label class="fld">所属分类（如 初高中 / CET-4 / 考研）</label>' +
        '<input type="text" id="bk-cat" placeholder="CET-4"></div>',
      actions: [{ label: '取消', cls: 'ghost' }, {
        label: '创建', cls: 'primary', onClick: function (close) {
          var n = U.$('#bk-name').value.trim(), c = U.$('#bk-cat').value.trim();
          if (!n) { WM.toast('请填写词库名称', 'bad'); return; }
          S.createBook(n, c || '未分类');
          close(); WM.toast('词库已创建，可到「导入词库」往里面加词', 'ok'); WM.App.refresh();
        }
      }]
    });
    setTimeout(function () { U.$('#bk-name').focus(); }, 30);
  }
  V.newBookDialog = newBookDialog;

  function renameBookDialog(id) {
    var b = S.getBook(id); if (!b) return;
    WM.modal({
      title: '重命名词库',
      body: '<label class="fld">名称</label><input type="text" id="rn-name" value="' + esc(b.name) + '">' +
        '<label class="fld" style="margin-top:10px">分类</label><input type="text" id="rn-cat" value="' + esc(b.category) + '">',
      actions: [{ label: '取消', cls: 'ghost' }, {
        label: '保存', cls: 'primary', onClick: function (close) {
          S.renameBook(id, U.$('#rn-name').value.trim() || b.name, U.$('#rn-cat').value.trim());
          close(); WM.toast('已更新', 'ok'); WM.App.refresh();
        }
      }]
    });
  }

  function exportBook(id) {
    var b = S.getBook(id); if (!b) return;
    var cols = ['index', 'word', 'phonetic', 'phonetic_us', 'pos', 'meaning', 'collocation',
      'derivative', 'example', 'example_cn', 'level', 'stage', 'freq_rank'];
    var map = { word: 't', phonetic: 'ph', phonetic_us: 'pu', pos: 'p', meaning: 'm', collocation: 'co', derivative: 'dv', example: 'ex', example_cn: 'exc', level: 'lv', stage: 'st', freq_rank: 'fr' };
    function q(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
    var out = [cols.join(',')];
    S.bookWords(id).forEach(function (w, i) {
      out.push(cols.map(function (c) {
        if (c === 'index') return i + 1;
        return q(w[map[c]] || (c === 'stage' ? w.st : ''));
      }).join(','));
    });
    U.download(b.name + '.csv', '\uFEFF' + out.join('\r\n'), 'text/csv');
    WM.toast('已导出 ' + b.name + '.csv', 'ok');
  }

  /* ==================================================================== *
   * 视图：词条浏览
   * ==================================================================== */
  var browseState = { q: '', filter: 'all', limit: 120 };

  V.words = {
    title: '词条浏览', actionsSticky: true,
    render: function (el, params) {
      params = params || {};
      var book = S.getBook(params.id);
      if (!book) { el.innerHTML = '<div class="card"><div class="empty">未找到该词库</div></div>'; return; }
      this.sub = '《' + book.name + '》 · ' + book.category;
      browseState.limit = 120;
      el.innerHTML =
        '<div class="card">' +
        '<div class="row">' +
        '<input type="search" id="q" placeholder="搜索单词 / 释义 / 例句（/ 聚焦）" style="max-width:320px" value="' + esc(browseState.q) + '">' +
        '<button class="chip ' + (browseState.filter === 'all' ? 'on' : '') + '" data-f="all">全部</button>' +
        '<button class="chip ' + (browseState.filter === 'unlearned' ? 'on' : '') + '" data-f="unlearned">未学</button>' +
        '<button class="chip ' + (browseState.filter === 'learned' ? 'on' : '') + '" data-f="learned">已学</button>' +
        '<button class="chip ' + (browseState.filter === 'mastered' ? 'on' : '') + '" data-f="mastered">已掌握</button>' +
        '<button class="chip nb ' + (browseState.filter === 'notebook' ? 'on' : '') + '" data-f="notebook">生词本</button>' +
        '<span class="muted" id="cnt"></span>' +
        '<span style="flex:1"></span>' +
        '<button class="btn sm" id="mk-learned">标记当前为已学</button>' +
        '<button class="btn sm" id="mk-unlearned">标记当前为未学</button>' +
        '</div></div>' +
        '<div class="card"><div class="scroll" id="tbl"></div>' +
        '<div class="row" style="margin-top:10px"><button class="btn sm" id="more">加载更多 (每页 120)</button><span class="muted" id="tipmore"></span></div></div>';

      WM.App.setActions('<button class="btn" id="back-books">← 返回词库</button>');
      U.$('#back-books').onclick = function () { WM.App.go('books'); };

      var input = U.$('#q', el);
      input.oninput = function () { browseState.q = input.value.trim(); draw(); };
      U.$$('[data-f]', el).forEach(function (c) {
        c.onclick = function () { browseState.filter = c.getAttribute('data-f'); browseState.limit = 120; V.words.render(el, params); };
      });
      U.$('#more').onclick = function () { browseState.limit += 120; draw(); };
      U.$('#mk-learned').onclick = function () { markCurrent(true); };
      U.$('#mk-unlearned').onclick = function () { markCurrent(false); };

      function currentList() {
        var ws = S.bookWords(book.id);
        if (browseState.filter === 'learned') ws = ws.filter(function (w) { return S.isLearned(w.__k); });
        if (browseState.filter === 'unlearned') ws = ws.filter(function (w) { return !S.isLearned(w.__k); });
        if (browseState.filter === 'mastered') ws = ws.filter(function (w) { return S.isMastered(w.__k); });
        if (browseState.filter === 'notebook') ws = ws.filter(function (w) { return S.state.notebook[w.__k]; });
        if (browseState.q) {
          var q = browseState.q.toLowerCase();
          ws = ws.filter(function (w) {
            return (w.t + ' ' + w.m + ' ' + w.ex + ' ' + w.exc).toLowerCase().indexOf(q) >= 0;
          });
        }
        return ws;
      }
      function markCurrent(flag) {
        var list = currentList();
        S.markLearned(list.map(function (w) { return w.__k; }), flag);
        WM.toast('已将 ' + list.length + ' 个词条标记为' + (flag ? '已学' : '未学'), 'ok');
        draw();
      }
      function draw() {
        var ws = currentList(), slice = ws.slice(0, browseState.limit);
        U.$('#cnt').textContent = '共 ' + ws.length + ' 条';
        U.$('#tipmore').textContent = slice.length < ws.length ? '（显示 ' + slice.length + ' / ' + ws.length + '）' : '';
        var rows = slice.map(function (w) {
          var p = S.state.progress[w.__k] || {}, nb = S.state.notebook[w.__k];
          var status = [];
          if (p.learned) status.push('<span class="tag g">已学</span>');
          if (S.isMastered(w.__k)) status.push('<span class="tag">掌握 ×' + p.streak + '</span>');
          if (nb) status.push('<span class="tag y">生词 ' + nb.wrongCount + ' 次</span>');
          if (p.seen) status.push('<span class="muted" style="font-size:11.5px">正确率 ' + Math.round(p.right / p.seen * 100) + '%</span>');
          return '<tr>' +
            '<td><b>' + esc(w.t) + '</b><div class="muted" style="font-size:11.5px">' + esc(w.ph || w.pu || '') + '</div></td>' +
            '<td>' + esc(w.p || '') + '</td>' +
            '<td>' + esc(w.m) + '</td>' +
            '<td>' + esc(w.cat || w.st || w.lv || '') + '</td>' +
            '<td>' + status.join(' ') + '</td>' +
            '<td style="white-space:nowrap">' +
            '<button class="btn sm" data-nb="' + esc(w.__k) + '">' + (nb ? '移出生词本' : '加入生词本') + '</button> ' +
            '<button class="btn sm" data-ln="' + esc(w.__k) + '">' + (p.learned ? '标记未学' : '标记已学') + '</button>' +
            '</td></tr>';
        }).join('');
        U.$('#tbl', el).innerHTML =
          '<table class="table"><thead><tr><th>单词</th><th>词性</th><th>释义</th><th>分类</th><th>状态</th><th>操作</th></tr></thead>' +
          '<tbody>' + (rows || '<tr><td colspan="6" class="muted">没有匹配的词条</td></tr>') + '</tbody></table>';
        U.$$('[data-nb]', el).forEach(function (b) {
          b.onclick = function () { S.toggleNotebook(b.getAttribute('data-nb')); WM.App.refreshSide(); draw(); };
        });
        U.$$('[data-ln]', el).forEach(function (b) {
          b.onclick = function () {
            var k = b.getAttribute('data-ln');
            S.prog(k).learned = !S.prog(k).learned; S.saveSoon(); draw(); WM.App.refreshSide();
          };
        });
      }
      draw();
      browseState.draw = draw;
    },
    onKey: function (e) {
      if (e.key === '/') { var q = U.$('#q'); if (q) { q.focus(); q.select(); return true; } }
      return false;
    }
  };

  /* ==================================================================== *
   * 视图：导入词库
   * ==================================================================== */
  var IM = {
    files: [], enc: 'auto', sheetIndex: {},
    targetMode: 'merge', targetBookId: '', newName: '', newCat: '',
    catMode: 'column', catColumn: '', catValue: '', dupMode: 'skip',
    mapping: null, unionHeaders: []
  };

  function extOf(name) { var i = name.lastIndexOf('.'); return i < 0 ? '' : name.slice(i + 1).toLowerCase(); }

  function parseFile(file, cb) {
    var ext = extOf(file.name);
    if (ext === 'xlsx' || ext === 'xlsm') {
      WM.readXlsx(file).then(function (res) {
        cb(null, { name: file.name, kind: 'xlsx', sheets: res.sheets, sheetIndex: 0 });
      }).catch(cb);
      return;
    }
    WM.readFileText(file, IM.enc === 'auto' ? 'utf-8' : IM.enc).then(function (t0) {
      var p = IM.enc === 'auto' && t0 && t0.indexOf('\uFFFD') >= 0
        ? WM.readFileText(file, 'gbk').then(function (t) { return t; }).catch(function () { return t0; })
        : Promise.resolve(t0);
      return p.then(function (text) {
        if (ext === 'json') {
          var t = WM.parser.parseJSONText(text);
          cb(null, { name: file.name, kind: 'json', sheets: [{ name: 'JSON', headers: t.headers, rows: t.rows, hasHeader: t.hasHeader }], sheetIndex: 0 });
        } else {
          var delim = ext === 'tsv' ? '\t' : WM.parser.detectDelimiter(text);
          var arr = WM.parser.parseDelimited(text, delim);
          var t2 = WM.parser.toObjects(arr);
          cb(null, { name: file.name, kind: 'delimited', delim: delim, sheets: [{ name: file.name, headers: t2.headers, rows: t2.rows, hasHeader: t2.hasHeader }], sheetIndex: 0 });
        }
      });
    }).catch(cb);
  }

  /** 合并所有选中文件的表头，并给出统一的字段映射（缺列自动留空） */
  function rebuildHeaders() {
    var set = {}, order = [];
    IM.files.forEach(function (f) {
      var sh = f.sheets[f.sheetIndex || 0];
      (sh.headers || []).forEach(function (h) { if (!set[h]) { set[h] = 1; order.push(h); } });
    });
    IM.unionHeaders = order;
    var guess = WM.parser.guessMapping(order);
    IM.mapping = IM.mapping || {};
    Object.keys(guess).forEach(function (k) { if (IM.mapping[k] == null) IM.mapping[k] = guess[k] || ''; });
    if (!IM.catColumn) IM.catColumn = IM.mapping.stage || IM.mapping.level || IM.mapping.category || '';
  }

  function activeRows() {
    var rows = [];
    IM.files.forEach(function (f) {
      var sh = f.sheets[f.sheetIndex || 0];
      (sh.rows || []).forEach(function (r) { rows.push({ __file: f.name, row: r }); });
    });
    return rows;
  }

  function preview() {
    var rows = activeRows().map(function (x) { return x.row; });
    return WM.buildWords(rows, IM.mapping, {
      categoryMode: IM.catMode, categoryColumn: IM.catColumn, categoryValue: IM.catValue
    });
  }

  V.import = {
    title: '导入词库', sub: '支持 CSV / TSV / JSON / Excel(.xlsx)，一次可选多个文件，可分批次追加到同一词库',
    render: function (el) {
      el.innerHTML =
        '<div class="card"><div class="card-hd"><h3>① 选择文件<span class="desc"> 可多选，也可以拖到这里；同一批文件会按先后顺序追加</span></h3></div>' +
        '<div class="drop" id="drop">点击选择文件，或把文件拖到这里<br><small class="muted">.csv / .tsv / .txt / .json / .xlsx / .xlsm 均可</small></div>' +
        '<input type="file" id="file" multiple hidden accept=".csv,.tsv,.txt,.json,.xlsx,.xlsm">' +
        '<div class="row" style="margin-top:10px"><label class="fld" style="width:auto">文件编码</label>' +
        '<select id="enc" style="max-width:150px"><option value="auto">自动识别</option><option value="utf-8">UTF-8</option><option value="gbk">GBK / 国标</option></select>' +
        '<span class="muted" id="files-meta"></span></div>' +
        '<div id="filelist" style="margin-top:8px"></div></div>' +
        '<div class="card" id="cfg" hidden></div>' +
        '<div class="card" id="rep" hidden></div>';

      var fileInput = U.$('#file', el), drop = U.$('#drop', el);
      drop.onclick = function () { fileInput.click(); };
      fileInput.onchange = function () { addFiles(fileInput.files); fileInput.value = ''; };
      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
      });
      drop.addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });
      U.$('#enc', el).onchange = function () {
        IM.enc = U.$('#enc', el).value;
        if (IM.files.length) { IM.files = []; drawFiles('<b>已切换编码，请重新选择文件</b>'); U.$('#cfg').hidden = true; U.$('#rep').hidden = true; }
      };
      addFiles(window.__WM_PENDING_FILES__ || null);

      function drawFiles(msg) {
        U.$('#files-meta', el).innerHTML = msg || ('已选 ' + IM.files.length + ' 个文件，共 ' + activeRows().length + ' 行数据');
        U.$('#filelist', el).innerHTML = IM.files.map(function (f, i) {
          var sh = f.sheets.length > 1
            ? ' <select data-sheet="' + i + '">' + f.sheets.map(function (s, j) {
              return '<option value="' + j + '"' + (j === (f.sheetIndex || 0) ? ' selected' : '') + '>' + esc(s.name) + '（' + s.rows.length + ' 行）</option>';
            }).join('') + '</select>' : '';
          return '<div class="row" style="padding:4px 0;border-bottom:1px solid var(--line2)">' +
            '<span class="tag c">' + esc(f.kind.toUpperCase()) + '</span><b>' + esc(f.name) + '</b>' +
            '<span class="muted">' + (f.sheets[f.sheetIndex || 0].rows.length) + ' 行</span>' + sh +
            '<span style="flex:1"></span><button class="btn sm danger" data-rm="' + i + '">移除</button></div>';
        }).join('');
        U.$$('[data-rm]', el).forEach(function (b) {
          b.onclick = function () {
            IM.files.splice(parseInt(b.getAttribute('data-rm'), 10), 1);
            rebuildHeaders(); drawFiles(); drawCfg(); drawReport(); WM.App.refreshSide();
          };
        });
        U.$$('[data-sheet]', el).forEach(function (s) {
          s.onchange = function () {
            IM.files[parseInt(s.getAttribute('data-sheet'), 10)].sheetIndex = parseInt(s.value, 10);
            rebuildHeaders(); drawFiles(); drawCfg(); drawReport();
          };
        });
      }

      function addFiles(list) {
        if (!list || !list.length) { drawFiles(); return; }
        var arr = Array.prototype.slice.call(list), jobs = [];
        arr.forEach(function (f, idx) {
          jobs.push(new Promise(function (res) {
            parseFile(f, function (err, parsed) {
              if (err) { WM.toast(f.name + ' 解析失败：' + err.message, 'bad'); res(); return; }
              IM.files.push(parsed); res();
            });
          }));
        });
        Promise.all(jobs).then(function () {
          rebuildHeaders(); drawFiles(); drawCfg(); drawReport(); WM.App.refreshSide();
          if (IM.files.length) WM.toast('解析完成，请确认字段映射', 'ok');
        });
      }

      /* ---------- 配置区 ---------- */
      function drawCfg() {
        var box = U.$('#cfg', el);
        if (!IM.files.length) { box.hidden = true; return; }
        box.hidden = false;
        var bookOpts = S.state.books.map(function (b) {
          return '<option value="' + b.id + '"' + (IM.targetBookId === b.id ? ' selected' : '') + '>' + esc(b.name) + '（' + esc(b.category) + ' · ' + b.wordKeys.length + ' 词）</option>';
        }).join('');
        var fields = Object.keys(WM.parser.FIELD_LABEL);
        box.innerHTML =
          '<div class="card-hd"><h3>② 导入设置</h3></div>' +
          '<div class="grid g2">' +
          '<div>' +
          '<label class="fld">目标词库</label>' +
          '<div class="row"><label class="chip ' + (IM.targetMode === 'merge' ? 'on' : '') + '"><input type="radio" name="tm" value="merge" hidden' + (IM.targetMode === 'merge' ? ' checked' : '') + '>合并到一个词库</label>' +
          '<label class="chip ' + (IM.targetMode === 'each' ? 'on' : '') + '"><input type="radio" name="tm" value="each" hidden' + (IM.targetMode === 'each' ? ' checked' : '') + '>每个文件各建一词库</label></div>' +
          (IM.targetMode === 'merge'
            ? '<div class="row" style="margin-top:8px"><select id="tbook" style="max-width:260px">' + bookOpts + '</select>' +
            '<button class="btn sm" id="newbk">＋ 新建词库并导入</button></div>'
            : '<div class="row" style="margin-top:8px"><input type="text" id="newcat" placeholder="统一分类，如 CET-4" value="' + esc(IM.newCat) + '" style="max-width:260px"></div>') +
          '<div class="row" style="margin-top:10px"><label class="fld" style="width:auto">重复词处理</label>' +
          '<select id="dup" style="max-width:230px">' +
          '<option value="skip"' + (IM.dupMode === 'skip' ? ' selected' : '') + '>跳过已有内容（仅补空缺字段 + 归入本词库）</option>' +
          '<option value="overwrite"' + (IM.dupMode === 'overwrite' ? ' selected' : '') + '>用新数据覆盖已有词条</option></select></div>' +
          '</div>' +
          '<div>' +
          '<label class="fld">分类来源（用于「按分类选题」）</label>' +
          '<div class="row"><label class="chip ' + (IM.catMode === 'column' ? 'on' : '') + '"><input type="radio" name="cm" value="column" hidden' + (IM.catMode === 'column' ? ' checked' : '') + '>取自文件列</label>' +
          '<label class="chip ' + (IM.catMode === 'fixed' ? 'on' : '') + '"><input type="radio" name="cm" value="fixed" hidden' + (IM.catMode === 'fixed' ? ' checked' : '') + '>统一填写</label></div>' +
          '<div class="row" style="margin-top:8px">' +
          (IM.catMode === 'column'
            ? '<select id="catcol" style="max-width:280px">' + IM.unionHeaders.map(function (h) {
              return '<option value="' + esc(h) + '"' + (h === IM.catColumn ? ' selected' : '') + '>' + esc(h) + '</option>';
            }).join('') + '</select>'
            : '<input type="text" id="catval" placeholder="如：四级新增" value="' + esc(IM.catValue) + '" style="max-width:280px">') +
          '</div>' +
          '<div class="muted" style="margin-top:6px;font-size:12px">提示：蓝本 CET-4 词库建议选 <code>stage</code>（初中/高中/四级）或 <code>level</code>（高频/中频/低频）列作为分类。</div>' +
          '</div>' +
          '</div>' +
          '<div style="margin-top:14px"><label class="fld">③ 字段映射（左侧为本程序字段，右侧选文件中对应的列名）</label>' +
          '<div class="grid g2">' + fields.map(function (f) {
            return '<div class="maprow">' +
              '<span>' + esc(WM.parser.FIELD_LABEL[f]) + '</span>' +
              '<select data-fm="' + f + '">' +
              '<option value="">— 不导入 —</option>' +
              IM.unionHeaders.map(function (h) {
                return '<option value="' + esc(h) + '"' + (IM.mapping[f] === h ? ' selected' : '') + '>' + esc(h) + '</option>';
              }).join('') + '</select>' +
              '<span class="maprow-h hname">' + esc(exampleOf(IM.mapping[f])) + '</span></div>';
          }).join('') + '</div></div>';

        U.$$('input[name=tm]', box).forEach(function (r) {
          r.parentNode.onclick = function () { IM.targetMode = r.value; drawCfg(); };
          r.onchange = function () { IM.targetMode = r.value; drawCfg(); };
        });
        U.$$('input[name=cm]', box).forEach(function (r) {
          r.parentNode.onclick = function () { IM.catMode = r.value; drawCfg(); drawReport(); };
          r.onchange = function () { IM.catMode = r.value; drawCfg(); drawReport(); };
        });
        var tb = U.$('#tbook', box); if (tb) tb.onchange = function () { IM.targetBookId = tb.value; };
        var nb = U.$('#newbk', box);
        if (nb) nb.onclick = function () {
          WM.modal({
            title: '新建词库并导入',
            body: '<label class="fld">名称</label><input type="text" id="n1" value="' + esc(suggestName()) + '">' +
              '<label class="fld" style="margin-top:10px">分类</label><input type="text" id="n2" value="CET-4">',
            actions: [{ label: '取消', cls: 'ghost' }, {
              label: '创建并选中', cls: 'primary', onClick: function (close) {
                var b = S.createBook(U.$('#n1').value.trim() || suggestName(), U.$('#n2').value.trim() || '未分类');
                IM.targetBookId = b.id; close(); drawCfg();
              }
            }]
          });
        };
        var nc = U.$('#newcat', box); if (nc) nc.oninput = function () { IM.newCat = nc.value; };
        U.$$('[data-fm]', box).forEach(function (sel) {
          sel.onchange = function () {
            IM.mapping[sel.getAttribute('data-fm')] = sel.value;
            drawCfg(); drawReport();
          };
        });
        var cc = U.$('#catcol', box); if (cc) cc.onchange = function () { IM.catColumn = cc.value; drawReport(); };
        var cv = U.$('#catval', box); if (cv) cv.oninput = function () { IM.catValue = cv.value; drawReport(); };
        var dp = U.$('#dup', box); if (dp) dp.onchange = function () { IM.dupMode = dp.value; drawReport(); };
        if (!IM.targetBookId && S.state.books.length) IM.targetBookId = S.state.books[S.state.books.length - 1].id;
      }

      function exampleOf(header) {
        if (!header) return '';
        for (var i = 0; i < IM.files.length; i++) {
          var rows = IM.files[i].sheets[IM.files[i].sheetIndex || 0].rows;
          for (var j = 0; j < Math.min(rows.length, 3); j++) {
            var v = rows[j][header];
            if (v) return String(v).slice(0, 18);
          }
        }
        return '';
      }

      function suggestName() {
        return IM.files.length ? IM.files[0].name.replace(/\.[^.]+$/, '') : '新词库';
      }

      /* ---------- 预览报告 ---------- */
      function drawReport() {
        var box = U.$('#rep', el);
        if (!IM.files.length) { box.hidden = true; return; }
        box.hidden = false;
        var r = preview();
        var existing = 0, fresh = 0;
        r.valid.forEach(function (v) { if (S.state.words[v.key]) existing++; else fresh++; });
        var dupCount = r.dupInFile.length;
        box.innerHTML =
          '<div class="card-hd"><h3>④ 导入预览</h3><span class="desc">确认无误后点右下角「开始导入」</span></div>' +
          '<div class="report">' +
          '<div><div class="n">' + activeRows().length + '</div><div class="l">文件数据行</div></div>' +
          '<div><div class="n" style="color:var(--ok)">' + fresh + '</div><div class="l">新增词条</div></div>' +
          '<div><div class="n" style="color:var(--brand)">' + existing + '</div><div class="l">库中已存在</div></div>' +
          '<div><div class="n" style="color:var(--warn)">' + dupCount + '</div><div class="l">本批重复</div></div>' +
          '<div><div class="n" style="color:var(--bad)">' + r.errors.length + '</div><div class="l">格式错误跳过</div></div>' +
          '</div>' +
          (r.errors.length
            ? '<details open><summary class="muted" style="cursor:pointer">查看错误明细（前 30 行）</summary>' +
            '<div class="scroll" style="margin-top:8px"><table class="table list-err"><thead><tr><th>行号</th><th>原因</th><th>内容预览</th></tr></thead><tbody>' +
            r.errors.slice(0, 30).map(function (e) {
              return '<tr><td>第 ' + e.line + ' 行</td><td>' + esc(e.reason) + '</td><td>' + esc(e.preview) + '</td></tr>';
            }).join('') + '</tbody></table></div></details>'
            : '') +
          (r.valid.length
            ? '<details><summary class="muted" style="cursor:pointer;margin-top:10px">查看前 5 条样例</summary>' +
            '<div class="scroll" style="margin-top:8px"><table class="table"><thead><tr><th>单词</th><th>音标</th><th>词性</th><th>释义</th><th>分类</th></tr></thead><tbody>' +
            r.valid.slice(0, 5).map(function (v) {
              return '<tr><td>' + esc(v.word.t) + '</td><td>' + esc(v.word.ph) + '</td><td>' + esc(v.word.p) +
                '</td><td>' + esc(v.word.m.slice(0, 30)) + '</td><td>' + esc(v.word.cat) + '</td></tr>';
            }).join('') + '</tbody></table></div></details>'
            : '<div class="empty">没有可导入的有效行，请检查字段映射</div>');

        var btnId = 'do-import';
        if (!U.$('#' + btnId, box)) {
          var wrap = document.createElement('div');
          wrap.className = 'row';
          wrap.style.cssText = 'margin-top:14px;justify-content:flex-end';
          wrap.innerHTML = '<button class="btn lg primary" id="' + btnId + '">开始导入（Enter）</button>';
          box.appendChild(wrap);
          U.$('#' + btnId, wrap).onclick = doImport;
        }
        box._count = r.valid.length;
      }

      /* ---------- 执行导入 ---------- */
      function doImport() {
        if (!IM.mapping.term) { WM.toast('请先指定「单词」对应的列', 'bad'); return; }
        if (IM.targetMode === 'merge' && !IM.targetBookId) {
          WM.toast('请选择目标词库，或切换为「每个文件各建一词库」', 'bad'); return;
        }
        var r = preview();
        if (!r.valid.length) { WM.toast('没有有效词条可导入', 'bad'); return; }
        var stat = { new: 0, updated: 0, linked: 0, skipped: 0 }, tgtName = '';

        if (IM.targetMode === 'each') {
          // 每个文件单独建库
          IM.files.forEach(function (f) {
            var rows = f.sheets[f.sheetIndex || 0].rows;
            var sub = WM.buildWords(rows, IM.mapping, {
              categoryMode: IM.catMode, categoryColumn: IM.catColumn, categoryValue: IM.catValue
            });
            var book = S.createBook(f.name.replace(/\.[^.]+$/, ''), IM.newCat || '未分类', '来源文件：' + f.name);
            sub.valid.forEach(function (v) {
              var res = S.upsertWord(v.word, book.id, IM.dupMode);
              stat[res] = (stat[res] || 0) + 1;
            });
            tgtName = '多个词库（按文件拆分）';
          });
        } else {
          var book = S.getBook(IM.targetBookId);
          tgtName = book.name;
          r.valid.forEach(function (v) {
            var res = S.upsertWord(v.word, IM.targetBookId, IM.dupMode);
            stat[res] = (stat[res] || 0) + 1;
          });
          book.updatedAt = Date.now();
        }
        S.reindex(); S.save(); WM.App.refreshSide();

        WM.modal({
          title: '导入完成',
          body: '<p>目标词库：<b>' + esc(tgtName) + '</b></p>' +
            '<ul style="line-height:2">' +
            '<li>新增词条：<b>' + stat['new'] + '</b></li>' +
            '<li>更新内容：<b>' + stat.updated + '</b></li>' +
            '<li>仅归入词库（内容重复，未覆盖）：<b>' + stat.linked + '</b></li>' +
            '<li>完全重复跳过：<b>' + stat.skipped + '</b></li>' +
            '<li>格式错误被忽略：<b>' + r.errors.length + '</b> 行</li>' +
            '</ul>' +
            (S.storageOK ? '' : '<p style="color:var(--bad)">注意：本地存储写入受限，建议到「设置与备份」导出备份。</p>') +
            '<p class="muted">继续导入下一批时，选择同一个目标词库即可按文件顺序追加。</p>',
          actions: [
            { label: '继续导入下一批', cls: 'ghost', onClick: function (close) { close(); } },
            { label: '去开始测试', cls: 'primary', onClick: function (close) { close(); WM.App.go('quiz'); } },
            { label: '查看词库', cls: '', onClick: function (close) { close(); WM.App.go('books'); } }
          ]
        });
        IM.files = []; IM.mapping = null; drawFiles(); drawCfg(); drawReport();
      }

      V._importApi = { addFiles: addFiles, drawReport: drawReport };
    },
    onKey: function (e) {
      if (e.key === 'Enter' && IM.files.length) { var b = U.$('#do-import'); if (b) { b.click(); return true; } }
      return false;
    }
  };
})(window);

</script>
<script>
/* ==== views-quiz.js ==== */
/* =========================================================================
 * WordMaster · views-quiz.js
 * 模块职责：首页概览 / 测试配置 / 答题与反馈 / 结果 / 生词本 / 统计 / 设置备份
 * ========================================================================= */
(function (global) {
  'use strict';
  var WM = global.WM, U = WM.util, S = WM.Store, V = WM.views = WM.views || {};
  function esc(s) { return U.esc(s); }

  /* 可持久化的默认出题配置 */
  var CFG = WM.cfg = {
    source: 'all', bookIds: [], categories: [], keys: [], levels: [],
    learning: 'all', count: 20, order: 'random',
    types: { choice: true, fill: true }, direction: 'mix'
  };
  WM.session = { qs: [], i: 0, results: [], startedAt: 0, cfgLabel: '', cfg: null, finished: true };

  /** 生成一枚可点选的 chip（同一 group 互斥） */
  function chip(group, val, label) {
    var cur = { src: CFG.source, lr: CFG.learning, od: CFG.order, dr: CFG.direction }[group];
    return '<button class="chip' + (cur === val ? ' on' : '') + '" data-' + group + '="' + esc(val) + '">' + esc(label) + '</button>';
  }

  /* ==================================================================== *
   * 首页
   * ==================================================================== */
  V.home = {
    title: '学习总览', sub: '',
    render: function (el) {
      var st = S.stats(), goal = S.state.settings.dailyGoal;
      var nbWords = S.notebookWords();
      var dueday = nbWords.filter(function (w) {
        var nb = S.state.notebook[w.__k];
        return nb && !nb.lastOk;
      }).length;
      el.innerHTML =
        '<div class="grid g4">' +
        card('brand', '词库 / 词条', st.books + '<small>词库</small>', st.words + ' 词') +
        card('ok', '已学 / 已掌握', st.learned + '<small>已学</small>', '掌握 ' + st.mastered) +
        card('purple', '生词本', st.notebook + '<small>词</small>', dueday + ' 个待消化') +
        card('', '累计正确率', st.accuracy + '<small>%</small>', st.answered + ' 次作答') +
        '</div>' +
        '<div class="card"><div class="card-hd"><h3>今日进度<span class="desc"> 目标 ' + goal + ' 题</span></h3></div>' +
        '<div class="bar ' + (st.today >= goal ? 'ok' : '') + '"><i style="width:' + Math.min(100, Math.round(st.today / goal * 100)) + '%"></i></div>' +
        '<div class="muted" style="margin-top:6px">今日已练 ' + st.today + ' 题 / 目标 ' + goal + ' 题</div></div>' +
        '<div class="card"><div class="card-hd"><h3>快捷开始</h3></div>' +
        '<div class="row">' +
        '<button class="btn lg primary" id="q-all">快速测试 20 题（随机 · 全部词库）</button>' +
        '<button class="btn lg" id="q-nb"' + (st.notebook ? '' : ' disabled') + '>生词本强化（' + st.notebook + ' 词）</button>' +
        '<button class="btn lg" id="q-new">未学词 20 题</button>' +
        '<button class="btn lg" id="q-cfg">按条件自定义 →</button>' +
        '</div></div>' +
        recentHtml();

      U.$('#q-all').onclick = function () { startQuiz(quickCfg('all')); };
      U.$('#q-nb').onclick = function () { startQuiz(quickCfg('notebook')); };
      U.$('#q-new').onclick = function () { startQuiz(quickCfg('all', 'unlearned')); };
      U.$('#q-cfg').onclick = function () { WM.App.go('quiz'); };
      U.$$('[data-again]', el).forEach(function (b) {
        b.onclick = function () { repeatHistory(b.getAttribute('data-again')); };
      });

      function card(cls, k, v, foot) {
        return '<div class="stat ' + cls + '"><div class="k">' + esc(k) + '</div><div class="v">' + v +
          '</div><div class="k" style="margin-top:4px">' + esc(foot) + '</div></div>';
      }
      function recentHtml() {
        var hs = S.state.history.slice(-8).reverse();
        return '<div class="card"><div class="card-hd"><h3>最近测试</h3>' +
          '<span class="desc">共 ' + st.tests + ' 次记录</span></div>' +
          (hs.length
            ? '<table class="table"><thead><tr><th>时间</th><th>范围</th><th>题量</th><th>正确率</th><th>用时</th><th></th></tr></thead><tbody>' +
            hs.map(function (h) {
              return '<tr><td>' + U.fmtDate(h.startedAt) + '</td><td>' + esc(h.label) + '</td><td>' + h.total +
                '</td><td>' + Math.round(h.correct / h.total * 100) + '%</td><td>' + dur(h) + '</td>' +
                '<td><button class="btn sm" data-again="' + h.id + '">同条件再来</button></td></tr>';
            }).join('') + '</tbody></table>'
            : '<div class="empty">还没有测试记录，点上面任意一个按钮开始吧</div>') + '</div>';
      }
    }
  };

  function dur(h) {
    var s = Math.round((h.finishedAt - h.startedAt) / 1000);
    return s < 60 ? s + ' 秒' : Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
  }
  function quickCfg(source, learning) {
    var c = JSON.parse(JSON.stringify(CFG));
    c.source = source; c.learning = learning || 'all'; c.count = Math.min(c.count, source === 'notebook' ? 999 : c.count);
    c.levels = [];   // 来源被快捷入口改写时，范围维度一并归零（与已有 bookIds / categories 处理一致）
    return c;
  }
  function repeatHistory(id) {
    var h = S.state.history.filter(function (x) { return x.id === id; })[0];
    if (!h) return;
    startQuiz(h.cfg, h.label);
  }

  /* ==================================================================== *
   * 测试配置
   * ==================================================================== */
  V.quiz = {
    title: '测试配置', sub: '自定义选题范围、题量与题型；Enter 直接开始',
    render: function (el) {
      var st = S.state;
      var lvSel = CFG.levels;
      var lvCount = WM.FreqLevel.LEVELS.map(function (L) {
        return { L: L, n: 0 };
      });
      (function () {
        var cnt = WM.FreqLevel.countBy(S.allWords());
        lvCount.forEach(function (x) { x.n = cnt[x.L.id] || 0; });
      })();
      el.innerHTML =
        '<div class="card"><div class="card-hd"><h3>① 选题范围</h3></div>' +
        '<div class="row"><span class="muted" style="width:72px">来源</span>' +
        chip('src', 'all', '全部词库') + chip('src', 'books', '指定词库') + chip('src', 'categories', '按分类') + chip('src', 'notebook', '仅生词本') +
        '</div>' +
        '<div id="src-books" class="row" style="margin-top:10px" hidden><span class="muted" style="width:72px">词库</span>' +
        st.books.map(function (b) {
          return '<label class="chip ' + (CFG.bookIds.indexOf(b.id) >= 0 ? 'on' : '') + '"><input type="checkbox" hidden data-bk="' + b.id + '"' +
            (CFG.bookIds.indexOf(b.id) >= 0 ? ' checked' : '') + '>' + esc(b.name) + '（' + b.wordKeys.length + '）</label>';
        }).join('') + '</div>' +
        '<div id="src-cats" class="row" style="margin-top:10px" hidden><span class="muted" style="width:72px">分类</span>' +
        S.categories().map(function (c) {
          return '<label class="chip ' + (CFG.categories.indexOf(c) >= 0 ? 'on' : '') + '"><input type="checkbox" hidden data-ct="' + esc(c) + '"' +
            (CFG.categories.indexOf(c) >= 0 ? ' checked' : '') + '>' + esc(c) + '</label>';
        }).join('') + '</div>' +
        '<div class="row" style="margin-top:10px"><span class="muted" style="width:72px">学习状态</span>' +
        chip('lr', 'all', '全部') + chip('lr', 'unlearned', '只看未学') + chip('lr', 'learned', '只看已学') +
        '</div>' +
        '<div class="row" style="margin-top:10px"><span class="muted" style="width:72px">使用频次</span>' +
        '<button class="chip' + (lvSel.length ? '' : ' on') + '" data-lvclear="1">不限</button>' +
        lvCount.map(function (x) {
          return '<label class="chip ' + (lvSel.indexOf(x.L.id) >= 0 ? 'on' : '') + '">' +
            '<input type="checkbox" hidden data-lv="' + esc(x.L.id) + '"' + (lvSel.indexOf(x.L.id) >= 0 ? ' checked' : '') + '>' +
            esc(x.L.name) + '（' + x.n + '）</label>';
        }).join('') +
        '</div>' +
        '<div class="muted" style="margin-top:6px;font-size:12px">三个维度取交集；使用频次「未选＝不限」。' +
        '分级依据词条 level 标签（高频/中频/低频），无标签时按词频序位区间归类：≤ 2000 高频 · 2001~6000 中频 · &gt; 6000 低频。</div>' +
        '</div>' +

        '<div class="card"><div class="card-hd"><h3>② 题量与顺序</h3></div>' +
        '<div class="row"><span class="muted" style="width:72px">题目数</span>' +
        '<input type="number" id="cnt" min="1" max="500" value="' + CFG.count + '" style="max-width:110px">' +
        '<button class="chip" data-n="10">10</button><button class="chip" data-n="20">20</button>' +
        '<button class="chip" data-n="50">50</button><button class="chip" data-n="100">100</button>' +
        '<button class="chip" data-n="999">不限</button></div>' +
        '<div class="row" style="margin-top:10px"><span class="muted" style="width:72px">出题顺序</span>' +
        chip('od', 'random', '随机') + chip('od', 'seq', '按导入顺序') + '</div>' +
        '</div>' +

        '<div class="card"><div class="card-hd"><h3>③ 题型与方向</h3></div>' +
        '<div class="row"><span class="muted" style="width:72px">题型</span>' +
        '<label class="chip ' + (CFG.types.choice ? 'on' : '') + '"><input type="checkbox" hidden id="ty-c"' + (CFG.types.choice ? ' checked' : '') + '>单项选择题</label>' +
        '<label class="chip ' + (CFG.types.fill ? 'on' : '') + '"><input type="checkbox" hidden id="ty-f"' + (CFG.types.fill ? ' checked' : '') + '>填空题</label>' +
        '<span class="muted" style="margin-left:12px">考察方向</span>' +
        chip('dr', 'mix', '混合') + chip('dr', 'en2cn', '英 → 中') + chip('dr', 'cn2en', '中 → 英') +
        '</div>' +
        '<div class="muted" style="margin-top:8px">单选：四选一，干扰项取自同类词汇；填空：据释义/例句补全单词，或据单词填中文释义（拼写允许 1~2 个字母误差，长词更宽松）。</div>' +
        '</div>' +

        '<div class="card"><div class="row" style="align-items:center">' +
        '<b>可选词数：<span id="avail" style="color:var(--brand)">0</span></b>' +
        '<span class="muted" id="hint"></span><span style="flex:1"></span>' +
        '<button class="btn lg primary" id="go">开始测试（Enter）</button></div></div>';

      U.$$('[data-src]', el).forEach(function (c) {
        c.onclick = function () { CFG.source = c.getAttribute('data-src'); V.quiz.render(el); };
      });
      U.$$('[data-lr]', el).forEach(function (c) {
        c.onclick = function () { CFG.learning = c.getAttribute('data-lr'); V.quiz.render(el); };
      });
      U.$$('[data-od]', el).forEach(function (c) {
        c.onclick = function () { CFG.order = c.getAttribute('data-od'); V.quiz.render(el); };
      });
      U.$$('[data-dr]', el).forEach(function (c) {
        c.onclick = function () { CFG.direction = c.getAttribute('data-dr'); V.quiz.render(el); };
      });
      U.$$('[data-n]', el).forEach(function (c) {
        c.onclick = function () { CFG.count = parseInt(c.getAttribute('data-n'), 10); U.$('#cnt', el).value = CFG.count; update(); };
      });
      U.$('#cnt', el).oninput = function () { CFG.count = U.clamp(parseInt(this.value, 10) || 0, 0, 999); update(); };
      U.$$('[data-bk]', el).forEach(function (cb) {
        cb.parentNode.onclick = function (e) {
          e.preventDefault();
          var id = cb.getAttribute('data-bk'), i = CFG.bookIds.indexOf(id);
          if (i >= 0) CFG.bookIds.splice(i, 1); else CFG.bookIds.push(id);
          V.quiz.render(el);
        };
      });
      U.$$('[data-ct]', el).forEach(function (cb) {
        cb.parentNode.onclick = function (e) {
          e.preventDefault();
          var c = cb.getAttribute('data-ct'), i = CFG.categories.indexOf(c);
          if (i >= 0) CFG.categories.splice(i, 1); else CFG.categories.push(c);
          V.quiz.render(el);
        };
      });
      U.$('#ty-c', el).onchange = U.$('#ty-f', el).onchange = function () {
        CFG.types.choice = U.$('#ty-c', el).checked; CFG.types.fill = U.$('#ty-f', el).checked;
        V.quiz.render(el);
      };
      var lvClr = U.$('[data-lvclear]', el);
      if (lvClr) lvClr.onclick = function () { CFG.levels = []; V.quiz.render(el); };
      U.$$('[data-lv]', el).forEach(function (cb) {
        cb.parentNode.onclick = function (e) {
          e.preventDefault();
          var id = cb.getAttribute('data-lv'), i = CFG.levels.indexOf(id);
          if (i >= 0) CFG.levels.splice(i, 1); else CFG.levels.push(id);
          V.quiz.render(el);
        };
      });
      U.$('#src-books', el).hidden = CFG.source !== 'books';
      U.$('#src-cats', el).hidden = CFG.source !== 'categories';
      U.$('#go', el).onclick = function () { doStart(); };

      function update() {
        var n = WM.Quiz.selectWords(cfgClone()).length;
        U.$('#avail', el).textContent = n;
        var limit = Math.min(CFG.count || n, n);
        U.$('#hint', el).textContent = '本次将出 ' + limit + ' 题' + (n === 0 ? '（该范围内暂无可用词条，请调整范围）' : '');
        U.$('#go', el).disabled = n === 0;
      }
      update();
    },
    onKey: function (e) {
      if (e.key === 'Enter') { U.$('#go').click(); return true; }
      return false;
    }
  };

  function cfgClone() {
    var c = JSON.parse(JSON.stringify(CFG));
    c.count = CFG.count >= 999 ? 1e9 : CFG.count;
    return c;
  }
  function labelOf(cfg) {
    var parts = [];
    if (cfg.source === 'notebook') parts.push('生词本');
    else if (cfg.source === 'books') parts.push('指定词库 ×' + cfg.bookIds.length);
    else if (cfg.source === 'categories') parts.push('分类：' + cfg.categories.join('/'));
    else if (cfg.source === 'keys') parts.push('指定词条');
    else parts.push('全部词库');
    if (cfg.learning === 'learned') parts.push('已学');
    if (cfg.learning === 'unlearned') parts.push('未学');
    if (cfg.levels && cfg.levels.length) {
      parts.push('频次：' + cfg.levels.map(function (id) {
        var L = WM.FreqLevel.byId(id); return L ? L.name : id;
      }).join('/'));
    }
    parts.push(cfg.order === 'random' ? '随机' : '顺序');
    var t = []; if (cfg.types.choice) t.push('单选'); if (cfg.types.fill) t.push('填空');
    parts.push(t.join('+') || '单选');
    parts.push({ mix: '混合', en2cn: '英→中', cn2en: '中→英' }[cfg.direction]);
    return parts.join(' · ');
  }

  function doStart() {
    var cfg = cfgClone();
    if (!cfg.types.choice && !cfg.types.fill) { WM.toast('至少选择一种题型', 'bad'); return; }
    startQuiz(cfg);
  }

  function startQuiz(cfg, label) {
    var built = WM.Quiz.build(cfg);
    if (!built.total) { WM.toast('该范围内没有可用词条', 'bad'); return; }
    WM.session = {
      qs: built.questions, i: 0, results: [], startedAt: Date.now(),
      cfgLabel: label || labelOf(cfg), cfg: cfg, finished: false
    };
    WM.App.go('run');
  }
  WM.startQuiz = startQuiz;

  /* ==================================================================== *
   * 答题
   * ==================================================================== */
  V.run = {
    title: '测试中', sub: '数字键 1~4 选择选项，Enter 提交 / 下一题，Esc 结束并查看结果',
    render: function (el) {
      var s = WM.session;
      if (s.finished) { WM.App.go('home'); return; }
      el.innerHTML =
        '<div class="quiz-wrap">' +
        '<div class="qprog"><span class="muted">第 <b id="qi">1</b>/' + s.qs.length + ' 题</span>' +
        '<div class="bar"><i id="qbar" style="width:0%"></i></div>' +
        '<span class="muted"><span id="qok">0</span> 正确 · <span id="qbad">0</span> 错误</span>' +
        '<button class="btn sm danger" id="abort">结束并查看结果</button></div>' +
        '<div id="qwrap"></div>' +
        '<div class="kbdhint">快捷键：<kbd>1</kbd>~<kbd>4</kbd> 选选项 · <kbd>Enter</kbd> 提交/下一题 · <kbd>Esc</kbd> 提前结束</div>' +
        '</div>';
      U.$('#abort', el).onclick = function () { finish(true); };
      draw();
    },
    onKey: function (e) {
      var s = WM.session;
      if (e.key === 'Escape') { finish(true); return true; }
      if (e.key === 'Enter') { handleEnter(); return true; }
      if (/^[1-4]$/.test(e.key) && curQ() && curQ().type === 'choice' && !s.results[s.i]) {
        chooseOption(parseInt(e.key, 10) - 1); return true;
      }
      return false;
    }
  };

  function curQ() { return WM.session.qs[WM.session.i]; }

  function draw() {
    var s = WM.session, q = curQ(), root = U.$('#qwrap');
    if (!root) return;
    U.$('#qi').textContent = s.i + 1;
    U.$('#qbar').style.width = (s.i / s.qs.length * 100) + '%';
    var okc = 0, badc = 0;
    s.results.forEach(function (r) { r.ok ? okc++ : badc++; });
    U.$('#qok').textContent = okc; U.$('#qbad').textContent = badc;

    var exHtml = '';
    if (q.stemEx || (q.type === 'fill' && q.dir === 'en2cn' && q.word.ex)) {
      exHtml = '<div class="qex">' + esc(q.stemEx || q.word.ex) +
        (q.type === 'fill' && q.fillMode === 'term' && q.stemExCn ? '' : (q.word.exc ? '<div class="cn">' + esc(q.word.exc) + '</div>' : '')) +
        '</div>';
    }
    var html = '<div class="qcard">' +
      '<div class="qstem">' + esc(q.title) + '</div>' +
      (q.sub ? '<div class="qsub">' + esc(q.sub) + '</div>' : '') +
      '<div><span class="qtip">' + esc(q.tip) + '</span></div>' +
      exHtml;
    if (q.type === 'choice') {
      html += '<div class="opts">' + q.options.map(function (o, i) {
        return '<button class="opt" data-o="' + i + '"><span class="no">' + (i + 1) + '</span><span>' + esc(o.text) + '</span></button>';
      }).join('') + '</div>';
    } else {
      html += '<div class="fillrow"><input type="text" id="fin" placeholder="输入答案后回车" autocomplete="off" spellcheck="false">' +
        '<button class="btn primary" id="fsub">提交（Enter）</button></div>';
    }
    html += '<div id="judge"></div></div>';
    root.innerHTML = html;

    if (q.type === 'choice') {
      U.$$('[data-o]', root).forEach(function (b) {
        b.onclick = function () { chooseOption(parseInt(b.getAttribute('data-o'), 10)); };
      });
    } else {
      var inp = U.$('#fin', root);
      inp.focus();
      inp.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submitFill(inp.value); }
      };
      U.$('#fsub', root).onclick = function () { submitFill(inp.value); };
    }
  }

  function chooseOption(idx) {
    var q = curQ();
    if (WM.session.results[WM.session.i]) return;      // 已作答
    submit({ index: idx });
  }
  function submitFill(v) {
    if (WM.session.results[WM.session.i]) { next(); return; }
    submit({ input: v });
  }
  function handleEnter() {
    var s = WM.session;
    if (s.results[s.i]) next();
    else {
      var q = curQ();
      if (q.type === 'fill') { var i = U.$('#fin'); if (i) { submitFill(i.value); return; } }
      WM.toast('请先作答', 'warn');
    }
  }

  function submit(payload) {
    var s = WM.session, q = curQ();
    var r = WM.Quiz.submit(q, payload);
    s.results[s.i] = { ok: r.ok, given: r.given, type: q.type, key: q.word.__k, note: r.note };
    renderFeedback(q, r, payload);
    WM.App.refreshSide();
  }

  function renderFeedback(q, r, payload) {
    var box = U.$('#judge');
    var w = q.word;
    var nbNow = !!S.state.notebook[w.__k];
    var html = '<div class="judge ' + (r.ok ? 'ok' : 'bad') + '">' +
      '<div class="verdict">' + (r.ok ? '✓ 回答正确' : '✗ 回答错误') +
      (r.note ? '<span class="muted" style="font-weight:400;font-size:12.5px"> · ' + esc(r.note) + '</span>' : '') + '</div>' +
      (r.ok ? '' : '<div style="margin-top:4px;font-size:13px">你填写：' + esc(r.given || '（空）') + '</div>') +
      '<div class="answer-box">' +
      '<div><span class="w">' + esc(w.t) + '</span>' +
      (w.ph || w.pu ? '<span class="ph">' + esc([w.ph, w.pu].filter(Boolean).join(' / ')) + '</span>' : '') +
      (w.p ? '<span class="tag" style="margin-left:8px">' + esc(w.p) + '</span>' : '') + '</div>' +
      '<div class="m">' + esc(w.m) + '</div>' +
      (w.cat || w.st || w.lv ? '<div class="kv">分类：' + esc([w.cat, w.st, w.lv].filter(Boolean).join(' / ')) + '</div>' : '') +
      (w.ex ? '<div class="ex">' + esc(w.ex) + (w.exc ? '<div class="cn">' + esc(w.exc) + '</div>' : '') + '</div>' : '') +
      (w.co ? '<div class="kv">搭配：' + esc(w.co) + '</div>' : '') +
      (w.dv ? '<div class="kv">派生：' + esc(w.dv) + '</div>' : '') +
      '<div class="kv">' + (nbNow
        ? '<span class="tag y">已自动加入生词本（累计错 ' + S.state.notebook[w.__k].wrongCount + ' 次）</span>'
        : '请继续：Enter → 下一题') +
      (r.outOfNotebook ? '｜连续答对已达标，自动移出生词本 🎉' : '') + '</div>' +
      '</div>' +
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn primary" id="next">' + (WM.session.i === WM.session.qs.length - 1 ? '查看结果（Enter）' : '下一题（Enter）') + '</button>' +
      '<button class="btn sm" id="to-nb">' + (nbNow ? '移出生词本' : '加入生词本') + '</button>' +
      '</div></div>';
    box.innerHTML = html;
    U.$('#next').onclick = next;
    U.$('#to-nb').onclick = function () {
      S.toggleNotebook(w.__k); WM.toast('已' + (S.state.notebook[w.__k] ? '加入' : '移出') + '生词本', 'ok');
      U.$('#to-nb').textContent = S.state.notebook[w.__k] ? '移出生词本' : '加入生词本';
      WM.App.refreshSide();
    };

    if (q.type === 'choice') {
      U.$$('[data-o]').forEach(function (b) {
        var i = parseInt(b.getAttribute('data-o'), 10);
        b.disabled = true;
        if (i === q.answerIndex) b.classList.add('correct');
        else if (i === payload.index) b.classList.add('wrong');
      });
    } else {
      var inp = U.$('#fin'); if (inp) { inp.disabled = true; }
      var fs = U.$('#fsub'); if (fs) fs.disabled = true;
    }
  }

  function next() {
    var s = WM.session;
    if (s.i < s.qs.length - 1) { s.i++; draw(); return; }
    finish(false);
  }

  function finish(aborted) {
    var s = WM.session;
    if (s.finished) return;
    s.finished = true;
    s.finishedAt = Date.now();
    var answered = s.results.filter(Boolean);
    var correct = answered.filter(function (r) { return r.ok; }).length;
    if (answered.length) {
      S.pushHistory({
        id: U.uid('h'), startedAt: s.startedAt, finishedAt: s.finishedAt,
        label: s.cfgLabel, total: answered.length, correct: correct,
        cfg: s.cfg, order: s.cfg.order, aborted: !!aborted,
        items: answered.map(function (r) { return { key: r.key, type: r.type, ok: r.ok, given: r.given }; })
      });
    }
    WM.App.go('result');
  }

  /* ==================================================================== *
   * 结果
   * ==================================================================== */
  V.result = {
    title: '测试结果', sub: '',
    render: function (el) {
      var s = WM.session;
      var answered = s.results.filter(Boolean);
      var correct = answered.filter(function (r) { return r.ok; }).length;
      var wrongs = answered.filter(function (r) { return !r.ok; });
      var acc = answered.length ? Math.round(correct / answered.length * 100) : 0;
      var seconds = Math.max(1, Math.round(((s.finishedAt || Date.now()) - s.startedAt) / 1000));
      this.sub = correct === answered.length && answered.length ? '全对！继续保持 🎉' : '错题已自动进入生词本';
      el.innerHTML =
        '<div class="quiz-wrap">' +
        '<div class="grid g4" style="margin-bottom:14px">' +
        '<div class="stat ' + (acc >= 80 ? 'ok' : acc >= 60 ? 'brand' : 'bad') + '"><div class="k">正确率</div><div class="v">' + acc + '<small>%</small></div></div>' +
        '<div class="stat"><div class="k">答对 / 已答</div><div class="v">' + correct + '<small>/' + answered.length + '</small></div></div>' +
        '<div class="stat purple"><div class="k">用时</div><div class="v">' + (seconds < 60 ? seconds + '<small>秒</small>' : Math.floor(seconds / 60) + '<small>分</small>') + '</div></div>' +
        '<div class="stat"><div class="k">平均每题</div><div class="v">' + (Math.round(seconds / Math.max(1, answered.length) * 10) / 10) + '<small>秒</small></div></div>' +
        '</div>' +
        '<div class="card"><div class="card-hd"><h3>错题回顾（' + wrongs.length + '）<span class="desc"> 已自动收入生词本</span></h3></div>' +
        (wrongs.length
          ? wrongs.map(function (r) {
            var w = S.state.words[r.key] || {};
            return '<div class="wrong-item"><div class="top"><span class="t">' + esc(w.t || r.key) + '</span>' +
              '<span class="muted">' + esc(w.ph || '') + ' ' + esc(w.p || '') + '</span></div>' +
              '<div>' + esc(w.m || '') + '</div>' +
              '<div class="muted" style="font-size:12.5px">你的答案：' + esc(r.given || '（空）') +
              (r.type === 'fill' ? '　正确答案：' + esc(w.t || '') : '') + '</div>' +
              (w.ex ? '<div class="muted" style="font-size:12.5px">' + esc(w.ex) + (w.exc ? '　' + esc(w.exc) : '') + '</div>' : '') +
              '</div>';
          }).join('')
          : '<div class="empty">没有错题，非常好 💪</div>') +
        '</div>' +
        '<div class="card"><div class="row">' +
        '<button class="btn lg primary" id="again">同条件再来一次</button>' +
        (wrongs.length ? '<button class="btn lg" id="rewrong">只测本次错题（' + wrongs.length + '）</button>' : '') +
        '<button class="btn lg" id="nb" >去生词本强化</button>' +
        '<button class="btn lg" id="home">回首页</button>' +
        '</div></div></div>';

      U.$('#again').onclick = function () { startQuiz(WM.session.cfg); };
      U.$('#home').onclick = function () { WM.App.go('home'); };
      U.$('#nb').onclick = function () { WM.App.go('notebook'); };
      var rw = U.$('#rewrong');
      if (rw) rw.onclick = function () {
        var cfg = JSON.parse(JSON.stringify(WM.session.cfg));
        cfg.source = 'keys';
        cfg.keys = wrongs.map(function (r) { return r.key; });
        cfg.count = cfg.keys.length;
        startQuiz(cfg, '本次错题重测');
      };
    },
    onKey: function (e) {
      if (e.key === 'Enter') { startQuiz(WM.session.cfg); return true; }
      return false;
    }
  };

  /* ==================================================================== *
   * 生词本
   * ==================================================================== */
  var nbSort = 'count';
  V.notebook = {
    title: '生词本', sub: '答错自动收录；连续答对设定次数后自动移出',
    render: function (el) {
      var list = S.notebookWords().map(function (w) { return { w: w, nb: S.state.notebook[w.__k], p: S.prog(w.__k) }; });
      if (nbSort === 'count') list.sort(function (a, b) { return b.nb.wrongCount - a.nb.wrongCount; });
      if (nbSort === 'recent') list.sort(function (a, b) { return (b.nb.lastWrong || 0) - (a.nb.lastWrong || 0); });
      if (nbSort === 'streak') list.sort(function (a, b) { return b.p.streak - a.p.streak; });
      var target = S.state.settings.streakTarget;

      el.innerHTML =
        '<div class="card"><div class="row">' +
        '<span class="muted">排序</span>' +
        sChip('count', '错误次数') + sChip('recent', '最近错误') + sChip('streak', '连对进度') +
        '<span style="flex:1"></span>' +
        '<span class="muted">共 <b>' + list.length + '</b> 词 · 连对 ' + target + ' 次自动移出</span>' +
        '<button class="btn primary" id="train"' + (list.length ? '' : ' disabled') + '>生词本强化测试</button>' +
        '<button class="btn" id="exp">导出 CSV</button>' +
        '<button class="btn danger" id="clr">清空生词本</button>' +
        '</div></div>' +
        '<div class="card">' + (list.length
          ? '<div class="scroll" style="max-height:none"><table class="table"><thead><tr><th>单词</th><th>音标/词性</th><th>释义</th><th>分类</th><th>错误次数</th><th>最近错误</th><th>连对</th><th>操作</th></tr></thead><tbody>' +
          list.map(function (x) {
            return '<tr><td><b>' + esc(x.w.t) + '</b></td>' +
              '<td class="muted">' + esc(x.w.ph || x.w.pu || '') + '<br>' + esc(x.w.p || '') + '</td>' +
              '<td>' + esc(x.w.m) + '</td>' +
              '<td>' + esc(x.w.cat || x.w.st || x.w.lv || '—') + '</td>' +

        '<span class="muted">次后自动移出生词本</span></div>' +
        '<div class="row" style="margin-top:10px"><label class="fld" style="width:auto">每日目标</label>' +
        '<input type="number" id="st-goal" min="5" max="500" value="' + s.dailyGoal + '" style="max-width:90px"><span class="muted">题</span></div>' +
        '<div class="row" style="margin-top:10px"><label class="chip"><input type="checkbox" id="st-auto"' + (s.autoNotebook ? ' checked' : '') + '>答错自动加入生词本</label></div>' +
        '<div class="row" style="margin-top:10px"><button class="btn primary" id="save">保存偏好</button></div>' +
        '</div></div>' +

        '<div class="card"><div class="card-hd"><h3>数据备份与迁移<span class="desc"> 全离线：备份文件就是 JSON，可自行保存/搬运</span></h3></div>' +
        '<div class="row">' +
        '<button class="btn" id="bk-full">导出完整备份（含词库）</button>' +
        '<button class="btn" id="bk-light">导出学习进度（不含词库）</button>' +
        '<button class="btn" id="bk-in">导入备份文件…</button>' +
        '<input type="file" id="bk-file" accept=".json" hidden>' +
        '<span style="flex:1"></span>' +
        '<button class="btn danger" id="clr-prog">清空学习进度</button>' +
        '<button class="btn danger" id="clr-all">清空全部数据</button>' +
        '</div>' +
        '<div class="muted" style="margin-top:8px">当前占用：约 ' + S.bookStorageSize() + ' KB；浏览器对单站点的本地存储通常限制在 5 MB 左右，' +
        '若词条极多建议定期导出备份。数据只保存在本机浏览器，清理浏览器数据会丢失，请善用导出。</div></div>';

      U.$('#save').onclick = function () {
        s.defaultCount = U.clamp(parseInt(U.$('#st-count').value, 10) || 20, 1, 500);
        s.order = U.$('#st-order').value;
        s.direction = U.$('#st-dir').value;
        s.types.choice = U.$('#st-c').checked; s.types.fill = U.$('#st-f').checked;
        s.showPhonetic = U.$('#st-ph').checked;
        s.streakTarget = U.clamp(parseInt(U.$('#st-streak').value, 10) || 3, 1, 10);
        s.dailyGoal = U.clamp(parseInt(U.$('#st-goal').value, 10) || 40, 5, 500);
        s.autoNotebook = U.$('#st-auto').checked;
        CFG.count = s.defaultCount; CFG.order = s.order; CFG.direction = s.direction;
        CFG.types = { choice: s.types.choice, fill: s.types.fill };
        S.save(); WM.toast('偏好已保存', 'ok');
      };
      U.$('#bk-full').onclick = function () { U.download('wordmaster-备份-含词库-' + U.today() + '.json', S.exportBackup(true), 'application/json'); };
      U.$('#bk-light').onclick = function () { U.download('wordmaster-进度备份-' + U.today() + '.json', S.exportBackup(false), 'application/json'); };
      U.$('#bk-in').onclick = function () { U.$('#bk-file').click(); };
      U.$('#bk-file').onchange = function () {
        var f = this.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          var data;
          try { data = JSON.parse(r.result); } catch (e) { WM.toast('不是合法 JSON 文件', 'bad'); return; }
          if (!data || data.app !== 'wordmaster') { WM.toast('不是 WordMaster 备份文件', 'bad'); return; }
          var hasLib = !!data.books && !!data.words;
          var restore = function (withLib) {
            try {
              S.importBackup(JSON.stringify(data), withLib);
            } catch (e2) { WM.toast('导入失败：' + e2.message, 'bad'); return; }
            WM.toast('备份已恢复' + (withLib ? '（含词库）' : '（仅进度）'), 'ok');
            WM.App.refresh(); WM.App.refreshSide();
          };
          if (hasLib) {
            WM.modal({
              title: '导入备份',
              body: '<p>该备份包含词库（' + (data.books.length) + ' 个词库）。请选择恢复方式：</p>',
              actions: [
                { label: '仅恢复进度/生词本/历史', cls: '', onClick: function (c) { c(); restore(false); } },
                { label: '连同词库一起恢复', cls: 'primary', onClick: function (c) { c(); restore(true); } }
              ]
            });
          } else restore(false);
        };
        r.readAsText(f, 'utf-8');
      };
      U.$('#clr-prog').onclick = function () {
        WM.modal({
          title: '清空学习进度', body: '<p>将清除所有答题记录、生词本与学习状态，<b>词库保留</b>。</p>',
          actions: [{ label: '取消', cls: 'ghost' }, {
            label: '确认清空', cls: 'danger', onClick: function (close) {
              S.clearProgress(); close(); WM.App.refresh(); WM.App.refreshSide(); WM.toast('学习进度已清空', 'ok');
            }
          }]
        });
      };
      U.$('#clr-all').onclick = function () {
        WM.modal({
          title: '清空全部数据', body: '<p style="color:var(--bad)">⚠️ 将删除全部词库、进度、生词本与历史，且无法撤销。建议先导出完整备份。</p>',
          actions: [{ label: '取消', cls: 'ghost' }, {
            label: '我已备份，确认清空', cls: 'danger', onClick: function (close) {
              S.clearAll(); close(); WM.App.go('import'); WM.App.refreshSide();
            }
          }]
        });
      };
    }
  };
})(window);

</script>
<script>
/* ==== app.js ==== */
/* =========================================================================
 * WordMaster · app.js
 * 模块职责：路由、导航、全局快捷键、启动引导
 * ========================================================================= */
(function (global) {
  'use strict';
  var WM = global.WM, U = WM.util, S = WM.Store, V = WM.views;

  var ORDER = ['home', 'quiz', 'books', 'import', 'notebook', 'stats', 'settings'];
  var App = WM.App = {
    cur: '', params: null,

    go: function (name, params) {
      if (!V[name]) name = 'home';
      if (location.hash !== '#/' + name) location.hash = '#/' + name;
      this.cur = name; this.params = params || null;
      this.render();
    },

    render: function () {
      var v = V[this.cur];
      var el = U.$('#view'), root = document.activeElement;
      U.$('#view-title').textContent = v.title;
      U.$('#view-sub').textContent = '';
      U.$('#view-actions').innerHTML = '';
      el.innerHTML = '';
      el.scrollTop = 0;
      v.render(el, this.params);
      U.$('#view-sub').textContent = v.sub || v.subTitle || '';
      U.$$('.nav-item').forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('data-view') === App.cur);
      });
      this.refreshSide();
      if (root && root.blur && /INPUT|TEXTAREA/.test(root.tagName)) { /* 保持输入焦点由视图自己处理 */ }
    },

    refresh: function () { this.render(); },

    setActions: function (html) { U.$('#view-actions').innerHTML = html; },

    refreshSide: function () {
      var n = Object.keys(S.state.notebook).length;
      var b = U.$('#nb-badge');
      if (b) { b.textContent = n; b.style.display = n ? '' : 'none'; }
      var st = S.stats();
      var s = U.$('#side-stat');
      if (s) s.textContent = st.words + ' 词 · ' + st.books + ' 库 · 今日 ' + st.today + ' 题';
    }
  };

  /* --------------------------------------------------------- 全局快捷键 */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    var inField = /INPUT|TEXTAREA|SELECT/.test(tag) || e.metaKey || e.ctrlKey;

    if (e.altKey && /^[1-7]$/.test(e.key)) {
      e.preventDefault(); App.go(ORDER[parseInt(e.key, 10) - 1]); return;
    }
    if (inField) return;
    var v = V[App.cur];
    if (v && v.onKey && v.onKey(e)) { e.preventDefault(); }
  });

  window.addEventListener('hashchange', function () {
    var name = (location.hash || '').replace('#/', '');
    if (name && name !== App.cur && V[name]) { App.cur = name; App.params = null; App.render(); }
  });

  /* --------------------------------------------------- Service Worker */
  /**
   * 仅在「安全上下文」中注册（https 或 localhost / 127.0.0.1）。
   * 双击打开本地单文件（file://）时不会注册，也不会报错；
   * 注册失败（例如目录里没有 sw.js）同样静默忽略，不影响正常使用。
   */
  function registerSW() {
    try {
      var secure = window.isSecureContext || location.protocol === 'https:' ||
        /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      if (!secure || !('serviceWorker' in navigator)) return;
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () { });
    } catch (e) { }
  }

  /* ------------------------------------------------------------- 启动 */
  function boot() {
    S.init();
    // 初始化默认出题配置
    var st = S.state.settings;
    WM.cfg.count = st.defaultCount; WM.cfg.order = st.order;
    WM.cfg.direction = st.direction;
    WM.cfg.types = { choice: st.types.choice, fill: st.types.fill };

    U.$$('.nav-item').forEach(function (a) {
      a.addEventListener('click', function () { App.go(a.getAttribute('data-view')); });
    });

    var name = (location.hash || '').replace('#/', '');
    if (!V[name]) name = S.state.books.length ? 'home' : 'import';
    App.go(name);

    if (!S.storageOK) {
      WM.toast('本地存储不可用（可能是隐私模式），数据将无法长期保存', 'warn');
    }

    registerSW();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
